---
- name: Add Longhorn Helm repo
  ansible.builtin.command: helm repo add longhorn https://charts.longhorn.io
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Write Longhorn Helm values
  ansible.builtin.copy:
    dest: /tmp/longhorn-values.yml
    content: |
      defaultSettings:
        defaultReplicaCount: {{ longhorn_replica_count }}
        defaultDataPath: {{ longhorn_storage_path }}
        storageMinimalAvailablePercentage: 10
        storageReservedPercentageForDefaultDisk: 5
        nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      {% if longhorn_create_default_disk_labeled_nodes is defined %}
        createDefaultDiskLabeledNodes: {{ longhorn_create_default_disk_labeled_nodes }}
      {% endif %}
      persistence:
        defaultClass: true
        defaultClassReplicaCount: {{ longhorn_replica_count }}
      ingress:
        enabled: false     # Access via kubectl port-forward or ingress later
    mode: "0644"

- name: Install Longhorn
  ansible.builtin.command: >
    helm upgrade --install longhorn longhorn/longhorn
    --namespace longhorn-system
    --create-namespace
    --version {{ longhorn_version }}
    --values /tmp/longhorn-values.yml
    --wait --timeout 10m
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  changed_when: true

- name: Add NFS provisioner Helm repo
  ansible.builtin.command: >
    helm repo add nfs-subdir-external-provisioner
    https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  when: longhorn_install_nfs_provisioner | default(true)

- name: Install NFS StorageClass provisioner
  ansible.builtin.command: >
    helm upgrade --install nfs-provisioner
    nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
    --namespace kube-system
    --set nfs.server={{ nfs_server_ip }}
    --set nfs.path={{ nfs_export_path }}
    --set storageClass.name=nfs-shared
    --set storageClass.defaultClass=false
    --wait
  when: longhorn_install_nfs_provisioner | default(true)
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  changed_when: true

- name: Print storage summary
  ansible.builtin.debug:
    msg:
      - "Longhorn UI:     kubectl port-forward -n longhorn-system svc/longhorn-frontend 8080:80"
      - "StorageClasses:  longhorn (default, NVMe replicated) | nfs-shared (SATA, shared)"

# NOTE: tags alone do NOT gate this — Ansible only skips tagged tasks when
# --tags/--skip-tags is explicitly passed on the CLI; with no such flag (as
# in 03-storage.yml, 03b-longhorn-nvme.yml, and 21-cluster2-longhorn.yml),
# every task here runs regardless of its tag. The `when:` below is the real
# gate — added after this was discovered to be silently running (and
# succeeding) against Cluster 2, pointing its backup-target at Cluster 1's
# exact TrueNAS path. Still enabled by default for Cluster 2 (see
# 21-cluster2-longhorn.yml) — just overrides longhorn_backup_target to a
# distinct path, doesn't disable backups outright.
- name: Configure Longhorn backup target
  ansible.builtin.include_tasks: backup-target.yml
  when: longhorn_configure_backup_target | default(true)
  tags: [longhorn-backup-target]

# NOTE: same tag-gating caveat as above — this always runs unless explicitly
# gated. Cluster 2 has no matching volumes (Vault isn't deployed there), so
# this is disabled for it in 21-cluster2-longhorn.yml.
- name: Configure Longhorn recurring jobs
  ansible.builtin.include_tasks: recurring-jobs.yml
  when: longhorn_configure_vault_recurring_jobs | default(true)
  tags: [longhorn-recurring-jobs]
