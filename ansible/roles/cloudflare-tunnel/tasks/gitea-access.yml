---
# ansible/roles/cloudflare-tunnel/tasks/gitea-access.yml
# Included once (not looped) by main.yml, after the shared cloudflare_access_hostnames
# loop and the Research Forum App task. Provisions a single, independently-scoped
# Access Policy for cloudflare_gitea_hostname, allowing BOTH emails in
# cloudflare_gitea_allowed_emails — separate from cloudflare_access_allowed_email
# and cloudflare_access_hostnames, which this file never reads or writes.
#
# The Access Application for gitea.kloud-worx.com already exists (created by
# prior runs of the shared access-app.yml loop, before gitea was removed from
# cloudflare_access_hostnames), along with a single-email Policy named
# "Allow {{ cloudflare_access_allowed_email }}". Rather than leave that policy
# in place and create a redundant second one, this updates it in place (PUT) —
# renaming it and expanding its include list — so the Application ends up with
# exactly one managed policy, with no window where the app has zero policies.
#
# Expects cf_api_token, cf_account_id, cf_google_idp_id and cf_all_apps to already
# be set by the including main.yml.

- name: "Check for existing Access Application ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.set_fact:
    cf_gitea_existing_app: "{{ cf_all_apps.json.result | selectattr('domain', 'equalto', cloudflare_gitea_hostname) | list }}"

- name: "Create Access Application ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_account_id }}/access/apps"
    method: POST
    headers:
      Authorization: "Bearer {{ cf_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ cloudflare_gitea_hostname }}"
      domain: "{{ cloudflare_gitea_hostname }}"
      type: self_hosted
      session_duration: "{{ cloudflare_access_session_duration }}"
      allowed_idps:
        - "{{ cf_google_idp_id }}"
    status_code: [200, 201]
  register: cf_gitea_created_app
  when: cf_gitea_existing_app | length == 0
  no_log: true

- name: "Resolve Access Application ID ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.set_fact:
    cf_gitea_app_id: "{{ cf_gitea_existing_app[0].id if (cf_gitea_existing_app | length > 0) else cf_gitea_created_app.json.result.id }}"

- name: "Check for existing Access Policies ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_account_id }}/access/apps/{{ cf_gitea_app_id }}/policies"
    method: GET
    headers:
      Authorization: "Bearer {{ cf_api_token }}"
    status_code: [200]
  register: cf_gitea_existing_policies
  no_log: true

- name: "Resolve target and legacy Gitea Access Policy matches"
  ansible.builtin.set_fact:
    cf_gitea_target_policy: "{{ cf_gitea_existing_policies.json.result | selectattr('name', 'equalto', 'Allow Gitea team') | list }}"
    cf_gitea_legacy_policy: "{{ cf_gitea_existing_policies.json.result | selectattr('name', 'equalto', 'Allow ' + cloudflare_access_allowed_email) | list }}"

- name: "Update legacy single-email Access Policy in place ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_account_id }}/access/apps/{{ cf_gitea_app_id }}/policies/{{ cf_gitea_legacy_policy[0].id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cf_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "Allow Gitea team"
      decision: allow
      include:
        - email:
            email: "{{ cloudflare_gitea_allowed_emails[0] }}"
        - email:
            email: "{{ cloudflare_gitea_allowed_emails[1] }}"
      session_duration: "{{ cloudflare_access_session_duration }}"
    status_code: [200]
  when:
    - cf_gitea_target_policy | length == 0
    - cf_gitea_legacy_policy | length > 0
  no_log: true

- name: "Create Access Policy ({{ cloudflare_gitea_hostname }})"
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_account_id }}/access/apps/{{ cf_gitea_app_id }}/policies"
    method: POST
    headers:
      Authorization: "Bearer {{ cf_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "Allow Gitea team"
      decision: allow
      include:
        - email:
            email: "{{ cloudflare_gitea_allowed_emails[0] }}"
        - email:
            email: "{{ cloudflare_gitea_allowed_emails[1] }}"
      session_duration: "{{ cloudflare_access_session_duration }}"
    status_code: [200, 201]
  when:
    - cf_gitea_target_policy | length == 0
    - cf_gitea_legacy_policy | length == 0
  no_log: true
