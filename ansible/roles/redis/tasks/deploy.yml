---
# Redis for LiteLLM's built-in response caching (litellm_settings.cache).
# Co-located in the litellm namespace since it's the only consumer.
# This is a cache, not durable storage — single replica, small PVC.

- name: Create litellm namespace
  ansible.builtin.shell: kubectl create namespace litellm --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  tags: [redis, redis-deploy]

- name: Create redis-credentials ExternalSecret
  ansible.builtin.copy:
    dest: /tmp/redis-external-secret.yml
    mode: "0644"
    content: |
      ---
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: redis-credentials
        namespace: litellm
      spec:
        refreshInterval: 1m
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: redis-credentials
          creationPolicy: Owner
        data:
          - secretKey: REDIS_PASSWORD
            remoteRef:
              key: secret/redis
              property: REDIS_PASSWORD
  tags: [redis, redis-deploy]

- name: Apply redis-credentials ExternalSecret
  ansible.builtin.command: kubectl apply -f /tmp/redis-external-secret.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  tags: [redis, redis-deploy]

- name: Wait for redis-credentials secret to sync from Vault
  ansible.builtin.command: >
    kubectl wait externalsecret/redis-credentials -n litellm
    --for=condition=Ready --timeout=90s
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  tags: [redis, redis-deploy]

- name: Deploy Redis PVC
  ansible.builtin.copy:
    dest: /tmp/redis-pvc.yml
    mode: "0644"
    content: |
      ---
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: redis-data
        namespace: litellm
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: {{ redis_storage_size }}
  tags: [redis, redis-deploy]

- name: Apply Redis PVC
  ansible.builtin.command: kubectl apply -f /tmp/redis-pvc.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  tags: [redis, redis-deploy]

- name: Deploy Redis Deployment and Service
  ansible.builtin.copy:
    dest: /tmp/redis-deploy.yml
    mode: "0644"
    content: |
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
        namespace: litellm
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: redis
        template:
          metadata:
            labels:
              app: redis
          spec:
            containers:
              - name: redis
                image: "redis:{{ redis_version }}"
                ports:
                  - containerPort: 6379
                env:
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: redis-credentials
                        key: REDIS_PASSWORD
                command: ["redis-server"]
                args: ["--requirepass", "$(REDIS_PASSWORD)"]
                volumeMounts:
                  - name: data
                    mountPath: /data
                resources:
                  requests:
                    memory: 64Mi
                    cpu: 50m
                  limits:
                    memory: 256Mi
                    cpu: 200m
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: redis-data
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
        namespace: litellm
      spec:
        type: ClusterIP
        selector:
          app: redis
        ports:
          - port: 6379
            targetPort: 6379
            name: redis
  tags: [redis, redis-deploy]

- name: Apply Redis deployment
  ansible.builtin.command: kubectl apply -f /tmp/redis-deploy.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  tags: [redis, redis-deploy]

- name: Print Redis summary
  ansible.builtin.debug:
    msg:
      - "Redis: redis.litellm.svc.cluster.local:6379"
      - "Password stored in Vault at secret/redis (key REDIS_PASSWORD) — populate it via make secrets"
      - "LiteLLM caching (litellm_settings.cache) is wired separately in the litellm role"
  tags: [redis, redis-deploy]
