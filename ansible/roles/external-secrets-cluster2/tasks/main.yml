---
# ansible/roles/external-secrets-cluster2/tasks/main.yml
# Forked from ansible/roles/external-secrets/ (2026-09-13) — that role hardcodes a batch
# of Cluster-1-specific ExternalSecret manifests (litellm/minio/postgres/gitea/grafana/
# alertmanager namespaces, none of which exist on Cluster 2) and applies them
# unconditionally, so it isn't safely reusable as-is. This fork keeps only the generic
# parts: Helm install + the ClusterSecretStore wiring to Cluster 2's own independent
# Vault. Cluster-2-specific ExternalSecrets (e.g. AdGuard Home's admin password, Part 2)
# get their own manifests defined alongside the service that needs them, not batched here.

- name: Add External Secrets Helm repo
  ansible.builtin.command: >
    helm repo add external-secrets https://charts.external-secrets.io
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Install External Secrets Operator
  ansible.builtin.command: >
    helm upgrade --install external-secrets
    external-secrets/external-secrets
    --version {{ eso_chart_version }}
    --namespace external-secrets
    --create-namespace
    --wait --timeout 10m
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  changed_when: true

- name: Wait for External Secrets CRDs to be established
  ansible.builtin.command: >
    kubectl wait crd/clustersecretstores.external-secrets.io
    --for=condition=Established
    --timeout=120s
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Create Vault service account + ClusterSecretStore for ESO
  ansible.builtin.copy:
    dest: /tmp/eso-vault-auth-cluster2.yml
    mode: "0644"
    content: |
      ---
      # Service account ESO uses to authenticate with Cluster 2's own Vault
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: external-secrets-vault
        namespace: external-secrets
      ---
      # ClusterSecretStore — connects ESO to Cluster 2's own independent Vault
      # (not Cluster 1's — see vault-cluster2 role). All namespaces can use this store.
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: vault-backend
      spec:
        provider:
          vault:
            server: "http://vault.vault.svc.cluster.local:8200"
            path: "secret"
            version: "v2"
            auth:
              kubernetes:
                mountPath: "kubernetes"
                role: "external-secrets"
                serviceAccountRef:
                  name: external-secrets-vault
                  namespace: external-secrets

- name: Apply ESO Vault auth config
  ansible.builtin.command: kubectl apply -f /tmp/eso-vault-auth-cluster2.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Print ESO summary
  ansible.builtin.debug:
    msg:
      - "External Secrets Operator deployed on Cluster 2"
      - "ClusterSecretStore 'vault-backend' points at Cluster 2's own independent Vault"
      - "Cluster-2-specific ExternalSecrets (e.g. AdGuard Home) are defined per-service, not here"
