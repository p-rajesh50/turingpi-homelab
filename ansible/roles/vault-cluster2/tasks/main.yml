---
# ansible/roles/vault-cluster2/tasks/main.yml
# Deploys an INDEPENDENT HashiCorp Vault on Cluster 2 — separate from Cluster 1's Vault,
# not shared (see SESSION-HANDOFF.md, 2026-09-13 decision).
# - Longhorn-backed PVC (storageClass longhorn, Cluster 2's default class)
# - Kubernetes auth only (no AppRole); ESO gets read-only per-service policies
#   (defaults/main.yml), homelab-admin stays for humans only
# - Vault is NOT auto-unsealed on boot. Cluster 2 has no BMC, so every power cycle leaves
#   Vault sealed. Run `make vault-unseal-cluster2` afterwards; until then ExternalSecrets
#   cannot refresh.
# - Init material lives ONLY in ~/.vault-init-cluster2.json on the workstation (mode 0600).
#   It is the only copy of the unseal keys and root token: back it up offline, outside the
#   repo and the cluster.
# - Secrets never go in argv. The root token and unseal keys reach the Vault CLI on stdin.
#   no_log scope: HARD no_log: true on init and on saving the keys file (their output is the
#   secret). The unseal and configure tasks use `vault_secret_no_log` (defaults/main.yml,
#   default true), so the value can be flipped for debugging. Never flip it on a live run.
# - Chart and image are PINNED (vault_chart_version, vault_image_tag). The live release is
#   vault-0.34.1 / hashicorp/vault:2.0.4. Upgrading either is a deliberate, reviewed change.
#   Pod-template changes restart the pod, which re-seals Vault and needs an unseal afterwards.
#
# Three states, read from `vault status -format=json` (not the exit code: exit 2 means
# sealed, which is normal here):
#   uninitialized            -> init, save keys, unseal, configure
#   initialized + sealed     -> unseal from saved keys, configure
#   initialized + unsealed   -> configure only (idempotent)

- name: Add HashiCorp Helm repo
  ansible.builtin.command: helm repo add hashicorp https://helm.releases.hashicorp.com
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Create vault namespace
  ansible.builtin.shell: |
    kubectl create namespace vault --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Write Vault Helm values
  ansible.builtin.copy:
    dest: /tmp/vault-values.yml
    mode: "0644"
    content: |
      server:
        # Pinned to the running release (live: vault-0.34.1, hashicorp/vault:2.0.4).
        image:
          repository: hashicorp/vault
          tag: "{{ vault_image_tag }}"

        # Run in standalone mode (single replica) — sufficient for homelab
        standalone:
          enabled: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "file" {
              path = "/vault/data"
            }

            # Allow Kubernetes pods to authenticate with Vault
            # using their service account tokens
            api_addr = "http://vault.vault.svc.cluster.local:8200"

        # Persist Vault data on Longhorn storage (Cluster 2 default StorageClass)
        dataStorage:
          enabled: true
          size: 10Gi
          storageClass: longhorn

        # Resource limits — CM4/CM5 nodes have ~8 GB RAM each
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m

        # Expose Vault within the cluster
        service:
          enabled: true
          type: ClusterIP
          port: 8200

      # Vault UI is cluster-internal only on Cluster 2 (no Cloudflare hostname yet)
      ui:
        enabled: true
        serviceType: ClusterIP

      # Injector injects Vault secrets into pods as files
      injector:
        enabled: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi

- name: Deploy Vault via Helm
  ansible.builtin.command: >
    helm upgrade --install vault hashicorp/vault
    --version {{ vault_chart_version }}
    --namespace vault
    --values /tmp/vault-values.yml
    --wait --timeout 10m
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  changed_when: true

- name: Wait for Vault pod to be running
  ansible.builtin.command: >
    kubectl wait pod/vault-0
    --for=jsonpath='{.status.phase}'=Running
    --namespace vault
    --timeout=300s
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  changed_when: false

- name: Read Vault status as JSON (exit 2 = sealed, expected here)
  ansible.builtin.command: kubectl exec vault-0 -n vault -- vault status -format=json
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  register: vault_status
  changed_when: false
  failed_when: vault_status.rc not in [0, 2]
  check_mode: false  # read-only; must run in check mode so the state parse below has data

- name: Parse Vault state
  ansible.builtin.set_fact:
    vault_state: "{{ vault_status.stdout | from_json }}"

- name: Check whether the saved keys file exists on this workstation
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.vault-init-cluster2.json"
  register: vault_keys_file
  delegate_to: localhost
  become: false
  check_mode: false  # read-only stat; the existence checks below depend on it

- name: Stop if Vault is initialized but its keys file is missing
  ansible.builtin.fail:
    msg: >-
      Vault is initialized, but ~/.vault-init-cluster2.json is missing on this workstation.
      Without it the sealed Vault cannot be unsealed. Restore it from the offline backup
      before running this role again. Do NOT re-initialize.
  when: vault_state.initialized and not vault_keys_file.stat.exists

- name: Stop if the keys file exists but Vault is not initialized
  ansible.builtin.fail:
    msg: >-
      ~/.vault-init-cluster2.json exists but this Vault is NOT initialized. The file does not
      match this Vault. Move it aside and investigate before initializing.
  when: not vault_state.initialized and vault_keys_file.stat.exists

# ── State: uninitialized ───────────────────────────────────────────────────────

- name: Verify the workstation home directory is writable before initializing
  ansible.builtin.command: test -w "{{ lookup('env', 'HOME') }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: not vault_state.initialized
  # Init must not run if the keys cannot be saved. Vault would be initialized with no copy
  # of its keys, which is unrecoverable.

- name: Initialize Vault (uninitialized state only)
  ansible.builtin.command: >
    kubectl exec vault-0 -n vault --
    vault operator init
    -key-shares=5
    -key-threshold=3
    -format=json
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  register: vault_init
  when: not vault_state.initialized
  changed_when: true
  no_log: true

- name: Save unseal keys and root token to the workstation (the only copy; mode 0600)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.vault-init-cluster2.json"
    content: "{{ vault_init.stdout }}"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false
  when: vault_init is changed
  no_log: true

- name: Print first-init backup warning (no secrets)
  ansible.builtin.debug:
    msg:
      - "Vault initialized. Keys saved to ~/.vault-init-cluster2.json (mode 0600)."
      - "This is the ONLY copy of the unseal keys and root token."
      - "Back it up offline now, outside the repo and the cluster."
  when: vault_init is changed

- name: Re-read Vault status after init (the threshold is only known now)
  ansible.builtin.command: kubectl exec vault-0 -n vault -- vault status -format=json
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"
  register: vault_status_post
  when: vault_init is changed
  changed_when: false
  failed_when: vault_status_post.rc not in [0, 2]

- name: Refresh Vault state after init
  ansible.builtin.set_fact:
    vault_state: "{{ vault_status_post.stdout | from_json }}"
  when: vault_init is changed

# ── States: initialized + sealed, or just initialized ─────────────────────────

- name: Unseal Vault from the saved keys (threshold read from vault_state.t)
  ansible.builtin.shell: |
    set -euo pipefail
    KEYS_FILE="{{ lookup('env', 'HOME') }}/.vault-init-cluster2.json"
    export KUBECONFIG="{{ lookup('env', 'HOME') }}/.kube/turingpi-cluster2.conf"
    # Threshold comes from the Vault status JSON (vault_state.t, passed in as
    # VAULT_THRESHOLD), not a hardcoded value.
    for i in $(seq 0 $((VAULT_THRESHOLD - 1))); do
      # Key path: python stdout -> kubectl stdin -> sh in the Vault container -> vault argv.
      # The key is in argv only inside the Vault container, never on this workstation.
      python3 -c "import json,sys; sys.stdout.write(json.load(open('$KEYS_FILE'))['unseal_keys_b64'][$i] + '\n')" \
        | kubectl exec -i -n vault vault-0 -- sh -c 'vault operator unseal "$(cat)" > /dev/null'
    done
  args:
    executable: /bin/bash
  environment:
    VAULT_THRESHOLD: "{{ vault_state.t }}"
  delegate_to: localhost
  become: false
  when: (vault_state.initialized and vault_state.sealed) or (vault_init is changed)
  changed_when: true
  no_log: "{{ vault_secret_no_log }}"

# ── Configure (runs in every state; idempotent) ───────────────────────────────

- name: Render read-only ESO policies for each service
  ansible.builtin.template:
    src: eso-policy.hcl.j2
    dest: "/tmp/vault-policy-{{ item.name }}.hcl"
    mode: "0644"
  loop: "{{ cluster2_eso_policies }}"
  delegate_to: localhost
  become: false

- name: Render the human admin policy (not bound to ESO)
  ansible.builtin.copy:
    dest: /tmp/vault-policy-homelab-admin.hcl
    mode: "0644"
    content: |
      # Human admin only. ESO must NOT be bound to this policy.
      path "secret/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
  delegate_to: localhost
  become: false

- name: Configure Vault auth, secrets engine, policies and ESO role (idempotent)
  ansible.builtin.shell: |
    set -euo pipefail
    KEYS_FILE="{{ lookup('env', 'HOME') }}/.vault-init-cluster2.json"
    export KUBECONFIG="{{ lookup('env', 'HOME') }}/.kube/turingpi-cluster2.conf"
    ROOT_TOKEN=$(python3 -c "import json; print(json.load(open('$KEYS_FILE'))['root_token'])")

    # The root token is the first stdin line. The container reads it into VAULT_TOKEN, so
    # it never appears in argv on either side.
    vx() {
      printf '%s\n' "$ROOT_TOKEN" | kubectl exec -i -n vault vault-0 -- \
        sh -c 'read -r VAULT_TOKEN; export VAULT_TOKEN; exec vault "$@"' sh "$@"
    }
    vpolicy() {
      { printf '%s\n' "$ROOT_TOKEN"; cat "$2"; } | kubectl exec -i -n vault vault-0 -- \
        sh -c 'read -r VAULT_TOKEN; export VAULT_TOKEN; exec vault policy write "$1" -' sh "$1"
    }

    # Kubernetes auth: enable only if missing
    AUTHS=$(vx auth list -format=json)
    case "$AUTHS" in *'"kubernetes/"'*) ;; *) vx auth enable kubernetes ;; esac
    vx write auth/kubernetes/config kubernetes_host="https://kubernetes.default.svc"

    # KV v2 at secret/: enable only if missing
    SECRETS=$(vx secrets list -format=json)
    case "$SECRETS" in *'"secret/"'*) ;; *) vx secrets enable -path=secret kv-v2 ;; esac

    # Policies: per-service read-only for ESO, plus the human admin policy
    {% for p in cluster2_eso_policies %}
    vpolicy "{{ p.name }}" "/tmp/vault-policy-{{ p.name }}.hcl"
    {% endfor %}
    vpolicy homelab-admin /tmp/vault-policy-homelab-admin.hcl

    # ESO role: bound to the ESO service account, read-only policies only
    vx write auth/kubernetes/role/external-secrets \
      bound_service_account_names=external-secrets-vault \
      bound_service_account_namespaces=external-secrets \
      policies={{ cluster2_eso_policies | map(attribute='name') | join(',') }} \
      ttl=24h
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: "{{ vault_secret_no_log }}"

- name: Print Vault state and operator summary
  ansible.builtin.debug:
    msg:
      - "Vault (Cluster 2) is in-cluster at: http://vault.vault.svc.cluster.local:8200"
      - "Cluster 2 has no Cloudflare hostname for Vault yet (cluster-internal only)."
      - "After ANY power cycle, Vault comes back SEALED. Run: make vault-unseal-cluster2"
      - "Until it is unsealed, ExternalSecrets cannot refresh."
      - "Check state: make vault-check-cluster2"
      - "~/.vault-init-cluster2.json is the ONLY copy of the unseal keys and root token."
      - "Keep an offline backup, outside the repo and the cluster."
