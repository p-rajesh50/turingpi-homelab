---
# LiteLLM AI Gateway — routes to local Ollama models AND cloud LLM APIs
# API keys are read from Kubernetes Secret 'llm-api-keys' in namespace 'litellm'
# Create keys with: make secrets   or   scripts/secrets/setup-api-keys.sh

- name: Create litellm namespace
  ansible.builtin.shell: kubectl create namespace litellm --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

# Namespace didn't exist yet when the external-secrets role tried to apply
# this ExternalSecret (ignore_errors swallowed the failure), so the
# litellm role creates + waits for its own copy here instead of relying on it.
- name: Create llm-api-keys ExternalSecret
  ansible.builtin.copy:
    dest: /tmp/litellm-external-secret.yml
    mode: "0644"
    content: |
      ---
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: llm-api-keys
        namespace: litellm
      spec:
        refreshInterval: 1m
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: llm-api-keys
          creationPolicy: Owner
        data:
          - secretKey: ANTHROPIC_API_KEY
            remoteRef:
              key: secret/llm-keys
              property: ANTHROPIC_API_KEY
          - secretKey: GEMINI_API_KEY
            remoteRef:
              key: secret/llm-keys
              property: GEMINI_API_KEY
          - secretKey: AZURE_FOUNDRY_API_KEY
            remoteRef:
              key: secret/llm-keys
              property: AZURE_FOUNDRY_API_KEY
          - secretKey: AZURE_FOUNDRY_API_BASE
            remoteRef:
              key: secret/llm-keys
              property: AZURE_FOUNDRY_API_BASE
          - secretKey: LITELLM_MASTER_KEY
            remoteRef:
              key: secret/llm-keys
              property: LITELLM_MASTER_KEY
          - secretKey: POSTGRES_PASSWORD
            remoteRef:
              key: secret/postgres
              property: POSTGRES_PASSWORD

- name: Apply llm-api-keys ExternalSecret
  ansible.builtin.command: kubectl apply -f /tmp/litellm-external-secret.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Wait for llm-api-keys secret to sync from Vault
  ansible.builtin.command: >
    kubectl wait externalsecret/llm-api-keys -n litellm
    --for=condition=Ready --timeout=90s
  changed_when: false
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Deploy LiteLLM config map
  ansible.builtin.copy:
    dest: /tmp/litellm-config.yml
    mode: "0644"
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-config
        namespace: litellm
      data:
        config.yaml: |
          model_list:
            # ── Local models via Orin NX — DEFERRED, module removed from the
            # board (see CLAUDE.md Hardware section). Re-add gemma3/mistral/
            # openchat/nomic-embed-text routes here once Orin NX is reinstalled.

            # ── Embedding via Jetson Nano (offloads from Orin NX) ─────────
            - model_name: all-minilm
              litellm_params:
                model: ollama/all-minilm
                api_base: http://{{ node_ips.jetson_nano }}:{{ ollama_port }}

            - model_name: phi3-mini
              litellm_params:
                model: ollama/phi3:mini
                api_base: http://{{ node_ips.jetson_nano }}:{{ ollama_port }}

            # ── Claude via Anthropic API ───────────────────────────────────
            - model_name: claude-sonnet
              litellm_params:
                model: anthropic/claude-sonnet-5
                api_key: os.environ/ANTHROPIC_API_KEY

            - model_name: claude-opus
              litellm_params:
                model: claude-opus-4-6
                api_key: os.environ/ANTHROPIC_API_KEY

            - model_name: claude-haiku
              litellm_params:
                model: anthropic/claude-haiku-4-5
                api_key: os.environ/ANTHROPIC_API_KEY

            # ── Gemini via Google AI API ───────────────────────────────────
            - model_name: gemini-pro
              litellm_params:
                model: gemini/gemini-1.5-pro
                api_key: os.environ/GEMINI_API_KEY

            - model_name: gemini-flash
              litellm_params:
                model: gemini/gemini-1.5-flash
                api_key: os.environ/GEMINI_API_KEY

            # ── Azure Foundry ────────────────────────────────────────────
            - model_name: gpt-4.1-mini
              litellm_params:
                model: openai/gpt-4.1-mini-1
                api_base: os.environ/AZURE_FOUNDRY_API_BASE
                api_key: os.environ/AZURE_FOUNDRY_API_KEY

            # ── Local Jetson llama.cpp servers (Phase 1, no auth) ──────────
            # Both are reasoning-tuned Gemma-4 models — a meaningful chunk of
            # max_tokens is spent on internal reasoning_content before any
            # visible `content` is produced, even for trivial prompts.
            # Live-verified 2026-08-29: gemma4-12b completed fully within 136
            # total tokens at max_tokens=200 (finish_reason=stop), but
            # gemma4-e2b needed ~400 (consistently burns ~190-200 tokens on
            # reasoning alone for something as simple as "hi", and returned
            # finish_reason=length with truncated/empty content at
            # max_tokens=200). Callers (demos, the tool-calling harness,
            # downstream LangGraph agents) should set max_tokens generously
            # (300-400+) rather than using small defaults, or gemma4-e2b
            # responses in particular may come back empty or cut off
            # mid-thought.
            #
            # Context window: neither model has a -c cap in
            # ansible/roles/llama-cpp-jetson/defaults/main.yml's extra_args.
            # gemma4-12b auto-sizes based on available memory at load time
            # (n_ctx_slot observed 168192-176128 across runs, not a fixed
            # value). gemma4-e2b runs at a large fixed n_ctx_slot=131072/128K
            # (confirmed live) — unlike gemma4-e4b on the Nano, which needed
            # an explicit -c 4096 cap to fix a real CUDA OOM crash-loop (see
            # SESSION-HANDOFF.md). gemma4-e2b hasn't hit that problem only
            # because its smaller weights (3.11GB) leave headroom for the
            # large KV cache — the ceiling itself is unbounded, so long
            # multi-turn conversations or concurrent requests (4 slots) on
            # either uncapped model carry the same latent OOM risk once real
            # LangGraph-agent traffic arrives. If either OOMs, the fix is the
            # same one already applied to gemma4-e4b: add an explicit -c cap.
            - model_name: orin-nx-gemma4-12b
              litellm_params:
                model: openai/gemma4-12b
                api_base: http://10.0.0.14:8081/v1
                api_key: "not-needed"

            - model_name: orin-nano-gemma4-e2b
              litellm_params:
                model: openai/gemma4-e2b
                api_base: http://10.0.0.50:8082/v1
                api_key: "not-needed"

          litellm_settings:
            drop_params: true
            success_callback: []

          general_settings:
            master_key: os.environ/LITELLM_MASTER_KEY
            database_url: os.environ/DATABASE_URL

- name: Apply LiteLLM config map
  ansible.builtin.command: kubectl apply -f /tmp/litellm-config.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Deploy LiteLLM Deployment and Service
  ansible.builtin.copy:
    dest: /tmp/litellm-deploy.yml
    mode: "0644"
    content: |
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm
        namespace: litellm
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm
        template:
          metadata:
            labels:
              app: litellm
          spec:
            containers:
              - name: litellm
                image: ghcr.io/berriai/litellm:main-latest
                ports:
                  - containerPort: 4000
                args: ["--config", "/app/config.yaml", "--port", "4000"]
                volumeMounts:
                  - name: config
                    mountPath: /app/config.yaml
                    subPath: config.yaml
                envFrom:
                  - secretRef:
                      name: llm-api-keys
                env:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: llm-api-keys
                        key: POSTGRES_PASSWORD
                  - name: DATABASE_URL
                    value: "postgresql://litellm:$(POSTGRES_PASSWORD)@postgres.litellm.svc.cluster.local:5432/litellm"
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 250m
                  limits:
                    memory: 2Gi
                    cpu: 1000m
            volumes:
              - name: config
                configMap:
                  name: litellm-config
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm
        namespace: litellm
        annotations:
          metallb.io/loadBalancerIPs: "{{ litellm_service_ip }}"
      spec:
        type: LoadBalancer
        selector:
          app: litellm
        ports:
          - port: 80
            targetPort: 4000
            name: http

- name: Apply LiteLLM deployment
  ansible.builtin.command: kubectl apply -f /tmp/litellm-deploy.yml
  changed_when: true
  environment:
    KUBECONFIG: "/home/{{ admin_user }}/.kube/config"

- name: Print LiteLLM summary
  ansible.builtin.debug:
    msg:
      - "LiteLLM Gateway: http://{{ litellm_service_ip }}/v1"
      - "OpenAI-compatible endpoint for all your apps and agents"
      - "Models available: all-minilm, phi3-mini (Jetson Nano), claude-sonnet, claude-opus, gemini-pro, gemini-flash"
      - "Run 'make secrets' to configure your Anthropic and Gemini API keys"
