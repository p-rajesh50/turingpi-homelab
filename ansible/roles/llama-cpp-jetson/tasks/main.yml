---
# Builds llama.cpp from source with CUDA support on a standalone Jetson Orin
# device (Orin NX or Orin Nano). JetPack 7.2 / CUDA 13.2 must be pre-flashed.

- name: Install build prerequisites
  ansible.builtin.apt:
    name:
      - git
      - cmake
      - build-essential
      - python3
      - python3-venv
      - python3-pip
      - curl
      - cuda-toolkit-13-2
    state: present
    update_cache: true
  register: apt_install_result
  until: apt_install_result is succeeded
  retries: 5
  delay: 15

- name: Detect host gcc version
  ansible.builtin.command: gcc -dumpversion
  register: gcc_version_raw
  changed_when: false

- name: Verify gcc version is within CUDA 13.2's supported range
  ansible.builtin.fail:
    msg: >-
      Detected gcc {{ gcc_version_raw.stdout }} (major version
      {{ gcc_version_raw.stdout.split('.')[0] }}), which is outside the range
      CUDA 13.2 supports on aarch64 (gcc {{ cuda_min_gcc }}.x - {{ cuda_max_gcc }}.x,
      per NVIDIA's CUDA 13.2 Installation Guide for Linux). Install a supported
      gcc version before building llama.cpp with GGML_CUDA=ON.
  when: >-
    (gcc_version_raw.stdout.split('.')[0] | int) < cuda_min_gcc or
    (gcc_version_raw.stdout.split('.')[0] | int) > cuda_max_gcc

- name: Clone/update llama.cpp
  ansible.builtin.git:
    repo: "{{ llama_cpp_repo }}"
    dest: "{{ llama_cpp_dest }}"
    version: "{{ llama_cpp_version }}"
    force: false
  become: false
  register: llama_cpp_clone

- name: Remove stale build directory after an upstream update
  ansible.builtin.file:
    path: "{{ llama_cpp_dest }}/build"
    state: absent
  become: false
  when: llama_cpp_clone.changed

- name: Configure CMake build (CUDA enabled)
  ansible.builtin.command:
    cmd: >-
      cmake -B build
      -DGGML_CUDA=ON
      -DCMAKE_CUDA_ARCHITECTURES={{ cuda_arch }}
      -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
      -DCMAKE_BUILD_TYPE=Release
      -DLLAMA_CURL=ON
    chdir: "{{ llama_cpp_dest }}"
    creates: "{{ llama_cpp_dest }}/build/Makefile"
  become: false

# changed_when inspects stdout for actual compiler/linker invocations rather
# than assuming every run changed something — cmake's Makefile wrapper always
# prints a "[100%] Built target ..." completion line even on a true no-op
# incremental build, so that alone can't be used as the changed signal; only
# "Building ... object" / "Linking ..." lines indicate real work was done.
- name: Build llama.cpp
  ansible.builtin.command:
    cmd: "cmake --build build --config Release -j {{ llama_build_parallelism }}"
    chdir: "{{ llama_cpp_dest }}"
  become: false
  register: llama_build_result
  changed_when: >-
    'Building CXX object' in llama_build_result.stdout or
    'Building C object' in llama_build_result.stdout or
    'Building CUDA object' in llama_build_result.stdout or
    'Linking CXX' in llama_build_result.stdout or
    'Linking CUDA' in llama_build_result.stdout
  async: 7200
  poll: 30

- name: Ensure models directory exists
  ansible.builtin.file:
    path: "{{ llama_cpp_dest }}/models"
    state: directory
    mode: "0755"
  become: false

- name: Download tiny CUDA smoke-test model (TinyLlama 1.1B Q4_K_M)
  ansible.builtin.get_url:
    url: "{{ llama_test_model_url }}"
    dest: "{{ llama_test_model_path }}"
    mode: "0644"
    checksum: "sha256:{{ llama_test_model_sha256 }}"
  become: false

- name: Run CUDA inference smoke test
  # llama-simple is the single-shot, non-interactive example binary — unlike
  # llama-cli, it doesn't default into a chat REPL that hangs forever reading
  # empty lines once stdin (closed by the command module) hits EOF.
  ansible.builtin.command:
    cmd: "./build/bin/llama-simple -m {{ llama_test_model_path }} -n 8 -ngl 99 hello"
    chdir: "{{ llama_cpp_dest }}"
  become: false
  register: llama_smoke_test
  changed_when: false

- name: Fail if CUDA device was not detected (silent CPU-only build)
  ansible.builtin.fail:
    msg: >-
      "ggml_cuda_init: found 1 CUDA devices" was not found in the llama-cli
      output — the build likely compiled CPU-only. Full output:
      {{ llama_smoke_test.stdout }} {{ llama_smoke_test.stderr }}
  when: "'ggml_cuda_init: found 1 CUDA devices' not in (llama_smoke_test.stdout + llama_smoke_test.stderr)"

- name: Print llama.cpp build summary
  ansible.builtin.debug:
    msg:
      - "llama.cpp binary: {{ llama_cpp_dest }}/build/bin/llama-cli"
      - "CUDA architecture: {{ cuda_arch }}"
      - "Build parallelism: {{ llama_build_parallelism }}"
      - "CUDA verification: found 1 CUDA devices — build is GPU-accelerated"

# ── Phase 1: server-mode models ──────────────────────────────────────────────
# orin-nx gets llama_models_orin_nx (Gemma-4-12B + Qwen3-8B, mutually
# exclusive via systemd Conflicts=), orin-nano gets llama_models_orin_nano
# (qwen3.5-4b + gemma4-e2b + gemma4-e4b, three-way mutually exclusive via
# the same mechanism). llama_default_active_units decides which unit(s)
# this task set enables/starts by default — always exactly one unit per
# host (llama_active_model_nx / llama_active_model_nano); systemd
# Conflicts= is what actually *enforces* exclusivity if someone starts a
# different one later (see templates/llama-server.service.j2 and
# README.md).
- name: Set this host's model list and default-active unit(s)
  ansible.builtin.set_fact:
    llama_models: "{{ llama_models_orin_nx if inventory_hostname == 'orin-nx' else llama_models_orin_nano }}"
    llama_default_active_units: >-
      {{ [llama_active_model_nx] if inventory_hostname == 'orin-nx'
         else [llama_active_model_nano] }}

# HF's resolve/main/<file> URL 302-redirects to a signed xet-bridge CDN URL —
# `-L` is required or a healthy file looks unreachable. Tries the primary
# repo first, then each fallback_repos entry in order; fails the play with a
# clear message if every source 401s/404s, before any multi-GB transfer
# starts. fallback_repos entries are {repo, filename} objects — filename
# defaults to the primary entry's filename when omitted, but must NOT be
# assumed identical across repos (e.g. ggml-org's gemma-4-E2B/E4B-it-GGUF
# repos only publish Q4_0, never the primary's Q4_K_M).
- name: Pre-flight check each model's download URL (fail fast, try fallbacks)
  ansible.builtin.shell: |
    set -o pipefail
    urls="https://huggingface.co/{{ item.repo }}/resolve/main/{{ item.filename }}{% for fb in item.fallback_repos %} https://huggingface.co/{{ fb.repo }}/resolve/main/{{ fb.filename | default(item.filename) }}{% endfor %}"
    for u in $urls; do
      if curl -sfI -L -o /dev/null "$u"; then
        echo "$u"
        exit 0
      fi
    done
    echo "All sources failed for {{ item.name }} ({{ item.filename }}): $urls" >&2
    exit 1
  args:
    executable: /bin/bash
  register: llama_url_check
  changed_when: false
  loop: "{{ llama_models }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record resolved download URL per model
  ansible.builtin.set_fact:
    llama_resolved_urls: "{{ (llama_resolved_urls | default({})) | combine({result.item.name: result.stdout}) }}"
  loop: "{{ llama_url_check.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item.name }}"

- name: Deploy, download, and start each model server
  ansible.builtin.include_tasks: deploy-model-server.yml
  loop: "{{ llama_models }}"
  loop_control:
    label: "{{ item.name }}"

- name: Print server-mode summary
  ansible.builtin.debug:
    msg: >-
      Default-active unit(s) on {{ inventory_hostname }}:
      {{ llama_default_active_units }} — other units on this host are
      installed (enabled=false) but not started. See README.md for the
      systemd Conflicts= exclusivity guarantee on orin-nx.
